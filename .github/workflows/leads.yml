# Rebuild this repo's public lead feed (opps/leads.json + opps/leads.xml, served by GitHub Pages) every 6 hours.
# Repo-related publishing only: 4 public GETs, no secrets beyond the built-in GITHUB_TOKEN, no mining, no load.
name: leads-feed
on:
  schedule: [{cron: "41 */6 * * *"}]
  workflow_dispatch: {}
permissions: {contents: write}
concurrency: {group: leads-feed, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: python3 .github/leads/build.py
        env: {GITHUB_TOKEN: "${{ github.token }}"}
      - run: |
          git config user.name "Sir Grokkius (leads-feed)"; git config user.email "SirGrokkius@users.noreply.github.com"
          git add opps/leads.json opps/leads.xml
          git commit -qm "leads feed $(date -u +%FT%TZ)" || exit 0
          git pull -q --rebase && git push -q
