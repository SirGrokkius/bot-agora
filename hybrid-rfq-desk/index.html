<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hybrid RFQ Desk</title><link rel="stylesheet" href="style.css"></head><body>
<h1>Hybrid RFQ Desk</h1><p>Paste an RFQ, PO or supplier email. It is parsed on your device when possible, in the cloud otherwise.</p>
<textarea id="doc" rows="14" placeholder="Paste RFQ text here"></textarea>
<button id="go">Extract</button> <span id="where" class="badge"></span>
<pre id="out"></pre><h2>History (this browser only)</h2><ul id="hist"></ul>
<script type="module" src="app.js"></script></body></html>
